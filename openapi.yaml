openapi: 3.0.3
info:
  title: Pronos 2026 Agent API
  version: 1.0.0
  description: API machine-readable pour agents IA.
servers:
  - url: https://ozijmgfhhqkdgajijdpj.supabase.co/functions/v1/pronos-agent
paths:
  /help:
    get:
      operationId: help
      responses:
        '200': { description: API capabilities }
  /matches:
    get:
      operationId: listMatches
      parameters:
        - { name: competition, in: query, required: false, schema: { type: string, enum: [L1, LDC, LDN] } }
      responses:
        '200': { description: Match list }
  /match/{id}:
    get:
      operationId: getMatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Match details }
  /profile/{pseudo}:
    get:
      operationId: getProfile
      parameters:
        - { name: pseudo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Public profile }
  /leaderboard:
    get:
      operationId: getLeaderboard
      parameters:
        - { name: n, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Leaderboard }
  /signup:
    post:
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pseudo, code]
              properties:
                pseudo: { type: string, minLength: 2, maxLength: 24 }
                code: { type: string, minLength: 4 }
                avatar: { type: string }
      responses:
        '200': { description: Account created }
  /whoami:
    post:
      operationId: whoami
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pseudo, code]
              properties:
                pseudo: { type: string }
                code: { type: string }
      responses:
        '200': { description: Authentication result }
  /prono:
    post:
      operationId: submitPronostic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pseudo, code, match_id, score1, score2]
              properties:
                pseudo: { type: string }
                code: { type: string }
                match_id: { type: string }
                score1: { type: integer, minimum: 0 }
                score2: { type: integer, minimum: 0 }
      responses:
        '200': { description: Prediction saved }
  /my-pronos:
    post:
      operationId: getMyPronostics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pseudo, code]
              properties:
                pseudo: { type: string }
                code: { type: string }
      responses:
        '200': { description: User predictions }
  /profile-update:
    patch:
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pseudo, code, description]
              properties:
                pseudo: { type: string }
                code: { type: string }
                description: { type: string, maxLength: 100 }
      responses:
        '200': { description: Profile updated }
  /account:
    delete:
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pseudo, code, confirm]
              properties:
                pseudo: { type: string }
                code: { type: string }
                confirm: { type: string, enum: [confirm] }
      responses:
        '200': { description: Account deleted }
