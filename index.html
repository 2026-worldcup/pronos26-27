<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronos 2026</title>
</head>
<body>
<p style="font-family:system-ui,sans-serif;text-align:center;margin:40px;">Chargement de Pronos 2026…</p>
<script>
(async () => {
  try {
    const response = await fetch('./legacy.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('Impossible de charger l’application.');
    let html = await response.text();
    const enhancementScript = '<script src="./profile-status.js"></scr' + 'ipt><script src="./league-nations.js"></scr' + 'ipt></body>';
    html = html.replace('</body>', enhancementScript);
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<p style="font-family:system-ui,sans-serif;text-align:center;margin:40px;color:#b91c1c;">Impossible de charger Pronos 2026.</p>';
    console.error(error);
  }
})();
</script>
</body>
</html>
