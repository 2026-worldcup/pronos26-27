<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronos 2026-2027 — Administration des Matchs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
    --bg-body: #0f172a;
    --bg-card: #1e293b;
    --bg-input: #334155;
    --text-main: #f8fafc;
    --text-muted: #94a3b8;
    --border: #334155;
    --primary: #38bdf8;
    --accent: #ff0055;
    --success: #22c55e;
    --danger: #ef4444;
    --shadow: 0 4px 12px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Montserrat', system-ui, sans-serif; background: var(--bg-body); color: var(--text-main); padding-bottom: 60px; }
h1, h2, h3 { font-weight: 800; }
button { font-family: inherit; cursor: pointer; border: none; }
input, select { font-family: inherit; }

/* HEADER */
.header { background: linear-gradient(120deg, #0f2557 0%, #1e1b4b 100%); color: #fff; padding: 20px; border-bottom: 4px solid var(--accent); }
.header-inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.logo-area h1 { font-size: 1.4rem; }
.logo-area .accent { color: var(--accent); }
.admin-badge { background: var(--accent); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; }

/* CONTAINER MAIN */
.page-wrap { max-width: 1100px; margin: 20px auto; padding: 0 20px; }

/* COMPETITION SELECTOR */
.comp-selector { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
.comp-btn { flex: 1; min-width: 160px; padding: 14px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; color: var(--text-muted); font-weight: 700; font-size: 0.95rem; text-align: center; transition: all 0.2s ease; }
.comp-btn:hover { border-color: var(--primary); color: var(--text-main); }
.comp-btn.active { background: #1e3a8a; border-color: var(--primary); color: #fff; box-shadow: var(--shadow); }

/* TABS NAV */
.nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
.tab-btn { padding: 10px 20px; background: transparent; color: var(--text-muted); font-weight: 700; font-size: 0.9rem; border-radius: 8px; }
.tab-btn.active { background: var(--primary); color: #0f172a; }

/* CARDS & FORMS */
.card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-group label { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
.form-group input, .form-group select { padding: 12px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 0.9rem; }
.form-group input:focus { outline: None; border-color: var(--primary); }

.btn { padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; transition: background 0.2s; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { opacity: 0.9; }
.btn-success { background: var(--success); color: #fff; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-secondary { background: var(--bg-input); color: #fff; }

/* EDIT MATCHES TABLE / LIST */
.filter-bar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-bar input, .filter-bar select { flex: 1; min-width: 170px; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; color: #fff; }
.filter-check { display: inline-flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; color: var(--text-main); font-size: .8rem; font-weight: 700; white-space: nowrap; }
.filter-check input { flex: 0 0 auto; min-width: 0; accent-color: var(--primary); }
#add-date-unconfirmed, #edit-confirmed { width: auto; padding: 0; accent-color: var(--primary); }
.schedule-badge { display: inline-block; width: fit-content; margin-top: 5px; padding: 4px 8px; border-radius: 6px; background: #fef3c7; color: #92400e; font-size: .7rem; font-weight: 800; }

.match-item { background: var(--bg-input); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 16px; align-items: center; }
.match-info { display: flex; flex-direction: column; gap: 4px; }
.match-teams { font-weight: 800; font-size: 1.05rem; }
.match-meta { font-size: 0.78rem; color: var(--text-muted); }

.schedule-warning { padding: 12px 14px; margin-bottom: 16px; border: 1px solid var(--danger); border-radius: 10px; background: rgba(239,68,68,.10); color: #fca5a5; font-size: .84rem; line-height: 1.5; }
.schedule-warning strong { color: #fecaca; }

.score-inputs { display: flex; align-items: center; gap: 8px; }
.score-inputs input { width: 50px; text-align: center; font-size: 1.1rem; font-weight: 800; padding: 8px; background: var(--bg-body); border: 1px solid var(--border); border-radius: 6px; color: #fff; }

.match-actions { display: flex; gap: 8px; }
.btn-sm { padding: 8px 12px; font-size: 0.78rem; border-radius: 6px; }

/* MODAL */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: var(--bg-card); border-radius: 14px; padding: 24px; width: 100%; max-width: 500px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-close { background: none; color: var(--text-muted); font-size: 1.2rem; }

/* TOASTS */
#toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 12px 18px; border-radius: 10px; color: #fff; font-weight: 700; font-size: .85rem; box-shadow: var(--shadow); }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

@media (max-width: 768px) {
    .match-item { grid-template-columns: 1fr; text-align: center; gap: 12px; }
    .score-inputs { justify-content: center; }
    .match-actions { justify-content: center; }
}
</style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="logo-area">
            <h1>Pronos <span class="accent">2026-2027</span> <span class="admin-badge">ADMIN</span></h1>
        </div>
        <div id="status-indicator" style="font-size:0.8rem; color:var(--text-muted);">🟢 Supabase Connecté</div>
    </div>
</header>

<div class="page-wrap">

    <!-- 1. SÉLECTEUR DE COMPÉTITION -->
    <div class="comp-selector">
        <button class="comp-btn active" data-code="L1" onclick="selectCompetition('L1')">🇫🇷 Ligue 1</button>
        <button class="comp-btn" data-code="LDC" onclick="selectCompetition('LDC')">🇪🇺 Ligue des Champions</button>
        <button class="comp-btn" data-code="LDN" onclick="selectCompetition('LDN')">🌍 Ligue des Nations</button>
        <button class="comp-btn" data-code="PL" onclick="selectCompetition('PL')">🏴 Premier League</button>
        <button class="comp-btn" data-code="SA" onclick="selectCompetition('SA')">🇮🇹 Serie A</button>
        <button class="comp-btn" data-code="LL" onclick="selectCompetition('LL')">🇪🇸 La Liga</button>
        <button class="comp-btn" data-code="BL" onclick="selectCompetition('BL')">🇩🇪 Bundesliga</button>
    </div>

    <!-- 2. ONGLETS D'ACTION -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('add')">➕ Ajouter un match</button>
        <button class="tab-btn" onclick="switchTab('edit')">✏️ Éditer / Résultats</button>
    </div>

    <!-- ONGLET 1 : AJOUTER UN MATCH -->
    <div id="tab-add" class="card">
        <h2 style="margin-bottom: 18px;">Ajouter un nouveau match</h2>
        <form id="form-add-match" onsubmit="handleAddMatch(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>Équipe 1 (Domicile)</label>
                    <input type="text" id="add-team1" placeholder="Ex: PSG" required>
                </div>
                <div class="form-group">
                    <label>Équipe 2 (Extérieur)</label>
                    <input type="text" id="add-team2" placeholder="Ex: Marseille" required>
                </div>
                <div class="form-group">
                    <label>Date et heure du coup d'envoi</label>
                    <input type="datetime-local" id="add-date" required>
                </div>
                <div class="form-group">
                    <label class="filter-check" style="height:100%; justify-content:flex-start; text-transform:none;"><input type="checkbox" id="add-date-unconfirmed" checked> Date à confirmer</label>
                </div>
                <div class="form-group">
                    <label>Phase / Journée</label>
                    <input type="text" id="add-phase" placeholder="Ex: Journée 1" required list="phase-suggestions">
                    <datalist id="phase-suggestions">
                        <option value="Journée 1">
                        <option value="Journée 2">
                        <option value="Phase de ligue - J1">
                        <option value="Groupe A1-Journée 1">
                    </datalist>
                </div>
                <div class="form-group">
                    <label>Ordre d'affichage (order_index)</label>
                    <input type="number" id="add-order" required readonly style="opacity: 0.7;" title="Calculé automatiquement">
                </div>
            </div>
            <button type="submit" class="btn btn-primary">➕ Enregistrer le match</button>
        </form>
    </div>

    <!-- ONGLET 2 : ÉDITER / SAISIR RÉSULTATS -->
    <div id="tab-edit" class="card" style="display:none;">
        <div class="filter-bar">
            <input type="text" id="filter-search" placeholder="Rechercher par équipe ou par phase..." oninput="renderMatchList()">
            <select id="filter-match-status" aria-label="Filtrer les matchs terminés ou non terminés" onchange="renderMatchList()">
                <option value="all">Tous les matchs</option>
                <option value="done">Matchs terminés</option>
                <option value="pending">Matchs non terminés</option>
            </select>
            <select id="filter-finished-window" aria-label="Période des matchs terminés" onchange="if (this.value !== 'all') document.getElementById('filter-match-status').value = 'done'; renderMatchList()">
                <option value="all">Toutes les dates de fin</option>
                <option value="24">Terminés dans les dernières 24 heures</option>
                <option value="48">Terminés dans les dernières 48 heures</option>
                <option value="168">Terminés dans la dernière semaine</option>
            </select>
            <label class="filter-check"><input type="checkbox" id="filter-date-unconfirmed" onchange="renderMatchList()"> Date à confirmer</label>
        </div>
        <div id="match-list-container">
            <!-- Liste générée dynamiquement -->
        </div>
    </div>

</div>

<!-- MODALE D'ÉDITION COMPLÈTE -->
<div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
        <div class="modal-header">
            <h3>Modifier le match</h3>
            <button class="modal-close" onclick="closeEditModal()">✕</button>
        </div>
        <form id="form-edit-match" onsubmit="handleSaveEdit(event)">
            <input type="hidden" id="edit-id">
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Équipe 1</label>
                <input type="text" id="edit-team1" required>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Équipe 2</label>
                <input type="text" id="edit-team2" required>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Date et heure</label>
                <input type="datetime-local" id="edit-date" required>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label for="edit-confirmed" style="display:flex; flex-direction:row; align-items:center; gap:10px; text-transform:none;">
                    <input type="checkbox" id="edit-confirmed" style="width:auto;">
                    Date à confirmer
                </label>
            </div>
            <div class="form-group" style="margin-bottom: 12px;">
                <label>Phase</label>
                <input type="text" id="edit-phase" required>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Order Index</label>
                <input type="number" id="edit-order" required>
            </div>
            <div style="display:flex; justify-content:space-between; gap:10px;">
                <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Annuler</button>
                <button type="submit" class="btn btn-primary">Sauvegarder</button>
            </div>
        </form>
    </div>
</div>

<div id="toast-container"></div>

<script>
/* ============================================================
   CONFIGURATION SUPABASE
   ============================================================ */
const SUPABASE_URL = "https://ozijmgfhhqkdgajijdpj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NdSPw6carmja35jlifSB9Q_2G3gabSt";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   ÉTAT GLOBAL
   ============================================================ */
let currentComp = 'L1';
let currentTab = 'add';
let matchesList = [];

/* ============================================================
   UTILITAIRES
   ============================================================ */
function showToast(msg, type = 'success') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerText = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
}

function formatDateFr(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    return d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function toDatetimeLocal(isoStr) {
    if (!isoStr) return '';
    const d = new Date(isoStr);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
}

function selectCompetition(code) {
    currentComp = code;
    document.querySelectorAll('.comp-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-code') === code);
    });
    loadMatches();
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && tab === 'add') || (i === 1 && tab === 'edit'));
    });
    document.getElementById('tab-add').style.display = tab === 'add' ? 'block' : 'none';
    document.getElementById('tab-edit').style.display = tab === 'edit' ? 'block' : 'none';
}

async function loadMatches() {
    try {
        const { data, error } = await supabaseClient
            .from('matches')
            .select('*')
            .eq('competition', currentComp)
            .order('order_index', { ascending: true })
            .order('match_date', { ascending: true });
        if (error) throw error;
        matchesList = data || [];
        updateNextOrderIndex();
        renderMatchList();
    } catch (e) {
        showToast("Erreur de chargement : " + e.message, "error");
    }
}

function updateNextOrderIndex() {
    if (matchesList.length === 0) document.getElementById('add-order').value = 1;
    else document.getElementById('add-order').value = Math.max(...matchesList.map(m => m.order_index || 0)) + 1;
}

async function handleAddMatch(e) {
    e.preventDefault();
    const team1 = document.getElementById('add-team1').value.trim();
    const team2 = document.getElementById('add-team2').value.trim();
    const dateVal = document.getElementById('add-date').value;
    const phase = document.getElementById('add-phase').value.trim();
    const orderIndex = parseInt(document.getElementById('add-order').value, 10);
    if (!team1 || !team2 || !dateVal || !phase) { showToast("Veuillez remplir tous les champs.", "error"); return; }
    const matchId = `${currentComp}-${Date.now()}`;
    const schedule_confirmed = !document.getElementById('add-date-unconfirmed').checked;
    const newMatch = { id: matchId, competition: currentComp, team1, team2, match_date: new Date(dateVal).toISOString(), phase, order_index: orderIndex, schedule_confirmed, created_at: new Date().toISOString() };
    const { error } = await supabaseClient.from('matches').insert([newMatch]);
    if (error) showToast("Erreur lors de l'ajout : " + error.message, "error");
    else { showToast("Match ajouté avec succès !"); document.getElementById('add-team1').value = ''; document.getElementById('add-team2').value = ''; document.getElementById('add-date').value = ''; document.getElementById('add-date-unconfirmed').checked = true; await loadMatches(); }
}

function renderMatchList() {
    const container = document.getElementById('match-list-container');
    const filter = document.getElementById('filter-search').value.toLowerCase();
    const statusFilter = document.getElementById('filter-match-status').value;
    const finishedWindow = document.getElementById('filter-finished-window').value;
    const onlyUnconfirmed = document.getElementById('filter-date-unconfirmed').checked;
    const now = Date.now();
    const windowMs = finishedWindow === 'all' ? null : Number(finishedWindow) * 60 * 60 * 1000;
    const futureByPhase = new Map();
    matchesList
        .filter(m => new Date(m.match_date).getTime() > Date.now() && m.score1 == null && m.score2 == null)
        .forEach(m => {
            if (!futureByPhase.has(m.phase)) futureByPhase.set(m.phase, []);
            futureByPhase.get(m.phase).push(m);
        });
    const suspectPhases = [...futureByPhase.entries()]
        .filter(([, games]) => games.length >= 8 && new Set(games.map(m => new Date(m.match_date).getTime())).size === 1)
        .map(([phase]) => phase);
    const warningHtml = suspectPhases.length
        ? `<div class="schedule-warning"><strong>Horaires à vérifier :</strong> ${suspectPhases.map(escapeHtml).join(', ')} — tous les matchs non joués de cette journée ont exactement la même date et heure. Vérifiez le calendrier officiel avant le coup d’envoi.</div>`
        : '';
    const filtered = matchesList.filter(m => {
        const matchesSearch = m.team1.toLowerCase().includes(filter) || m.team2.toLowerCase().includes(filter) || m.phase.toLowerCase().includes(filter);
        const done = m.score1 !== null && m.score1 !== undefined && m.score2 !== null && m.score2 !== undefined;
        const matchesStatus = statusFilter === 'all' || (statusFilter === 'done' && done) || (statusFilter === 'pending' && !done);
        const estimatedEnd = new Date(m.match_date).getTime() + 2 * 60 * 60 * 1000;
        const matchesWindow = !done || windowMs === null || (estimatedEnd <= now && estimatedEnd >= now - windowMs);
        const matchesSchedule = !onlyUnconfirmed || m.schedule_confirmed === false;
        return matchesSearch && matchesStatus && matchesWindow && matchesSchedule;
    });
    if (filtered.length === 0) { container.innerHTML = warningHtml + `<p style="text-align:center; color:var(--text-muted); padding:20px;">Aucun match trouvé pour cette compétition.</p>`; return; }
    container.innerHTML = warningHtml + filtered.map(m => {
        const s1 = m.score1 !== null && m.score1 !== undefined ? m.score1 : '';
        const s2 = m.score2 !== null && m.score2 !== undefined ? m.score2 : '';
        const scheduleBadge = m.schedule_confirmed === false ? '<span class="schedule-badge">Date à confirmer</span>' : '';
        return `<div class="match-item"><div class="match-info"><div class="match-teams">${escapeHtml(m.team1)} vs ${escapeHtml(m.team2)}</div><div class="match-meta">${m.schedule_confirmed === false ? 'Date et heure à confirmer' : formatDateFr(m.match_date)} | ${escapeHtml(m.phase)} | Index: ${m.order_index}</div>${scheduleBadge}</div><div class="score-inputs"><input type="number" min="0" id="score1-${m.id}" value="${s1}" placeholder="-"><span>:</span><input type="number" min="0" id="score2-${m.id}" value="${s2}" placeholder="-"><button class="btn btn-success btn-sm" onclick="saveScore('${m.id}')">💾 Score</button></div><div class="match-actions"><button class="btn btn-secondary btn-sm" onclick="openEditModal('${m.id}')">✏️ Modifier</button><button class="btn btn-danger btn-sm" onclick="deleteMatch('${m.id}')">🗑️</button></div></div>`;
    }).join('');
}

async function saveScore(matchId) {
    const s1Val = document.getElementById(`score1-${matchId}`).value;
    const s2Val = document.getElementById(`score2-${matchId}`).value;
    const score1 = s1Val === '' ? null : parseInt(s1Val, 10);
    const score2 = s2Val === '' ? null : parseInt(s2Val, 10);
    const { error } = await supabaseClient.from('matches').update({ score1, score2 }).eq('id', matchId);
    if (error) showToast("Erreur d'enregistrement : " + error.message, "error");
    else { showToast("Score mis à jour !"); loadMatches(); }
}

async function deleteMatch(matchId) {
    if (!confirm("Voulez-vous vraiment supprimer ce match ? Cette action est irréversible.")) return;
    const { error } = await supabaseClient.from('matches').delete().eq('id', matchId);
    if (error) showToast("Erreur lors de la suppression : " + error.message, "error");
    else { showToast("Match supprimé."); loadMatches(); }
}

function openEditModal(matchId) {
    const m = matchesList.find(x => x.id === matchId);
    if (!m) return;
    document.getElementById('edit-id').value = m.id;
    document.getElementById('edit-team1').value = m.team1;
    document.getElementById('edit-team2').value = m.team2;
    document.getElementById('edit-date').value = toDatetimeLocal(m.match_date);
    document.getElementById('edit-confirmed').checked = m.schedule_confirmed === false;
    document.getElementById('edit-phase').value = m.phase;
    document.getElementById('edit-order').value = m.order_index;
    document.getElementById('edit-modal').style.display = 'flex';
}

function closeEditModal() { document.getElementById('edit-modal').style.display = 'none'; }

async function handleSaveEdit(e) {
    e.preventDefault();
    const id = document.getElementById('edit-id').value;
    const team1 = document.getElementById('edit-team1').value.trim();
    const team2 = document.getElementById('edit-team2').value.trim();
    const dateVal = document.getElementById('edit-date').value;
    const phase = document.getElementById('edit-phase').value.trim();
    const order_index = parseInt(document.getElementById('edit-order').value, 10);
    const schedule_confirmed = !document.getElementById('edit-confirmed').checked;
    const { error } = await supabaseClient.from('matches').update({ team1, team2, match_date: new Date(dateVal).toISOString(), phase, order_index, schedule_confirmed }).eq('id', id);
    if (error) showToast("Erreur : " + error.message, "error");
    else { showToast("Match modifié avec succès !"); closeEditModal(); loadMatches(); }
}

function escapeHtml(str) { return String(str || '').replace(/[&<>\"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;' }[c])); }

loadMatches();
</script>
<script src="./league-nations-admin.js"></script>
</body>
</html>
