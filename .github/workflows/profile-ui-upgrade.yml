name: Apply profile UI upgrade

on:
  push:
    paths:
      - '.github/workflows/profile-ui-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply existing profile patch directly to index.html
        run: |
          set -e
          git show HEAD^:.github/workflows/profile-ui-upgrade.yml > /tmp/old-workflow.yml
          awk '/python3 - <<'"'"'PY'"'"'/{flag=1; next} /^          PY$/{flag=0} flag { sub(/^          /, ""); print }' /tmp/old-workflow.yml > /tmp/profile_patch.py
          python3 /tmp/profile_patch.py

      - name: Commit index.html and remove temporary workflow
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/profile-ui-upgrade.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: redesign player profiles and prediction history"
          git push
